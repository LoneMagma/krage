<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 280" fill="none" role="img" aria-label="kRAGE">
  <g transform="translate(128 142)">
    <!-- cube body -->
    <path d="M0 -100 L82 -54 L82 46 L0 100 L-82 46 L-82 -54 Z"
          fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 -100 L82 -54 L0 0 L-82 -54 Z" fill="#FFFFFF" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-82 -54 L0 0 L0 100 L-82 46 Z" fill="#000000" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-82 -54 L0 0 L0 100 L-82 46 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M82 -54 L0 0 L0 100 L82 46 Z" fill="#FFFFFF" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-20 8 L20 8 L0 72 Z" fill="#000000"/>

    <!--
      Bold geometric K on top face.
      Drawn as filled paths in the top diamond plane (not stroke sticks).
      Spine vertical, arms solid wedges — reads as a letter, not a symbol.
    -->
    <g>
      <!-- vertical spine of K (slightly isometric lean) -->
      <path d="M-30 -78 L-14 -70 L-14 -30 L-30 -38 Z" fill="#000000"/>
      <!-- upper arm -->
      <path d="M-14 -58 L28 -82 L36 -74 L-14 -46 Z" fill="#000000"/>
      <!-- lower arm -->
      <path d="M-14 -50 L36 -26 L28 -18 L-14 -42 Z" fill="#000000"/>
    </g>
  </g>
</svg>
